# Crea o completa la publicación (Release) de cada versión a partir de los ZIP de descargas/.
# Los ZIP se construyen, prueban y auditan (Windows y Mac) en el repositorio privado de QR Studio.
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ["descargas/*.zip", "notas/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar cada ZIP con su suma SHA-256
        run: cd descargas && sha256sum -c *.sha256

      - name: Crear o completar la publicación de cada versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staging
          for zip in descargas/QR-Studio-*-*.zip; do
            name=$(basename "$zip")
            version=$(echo "$name" | sed -E 's/QR-Studio-(.+)-(Windows|Mac)\.zip/\1/')
            platform=$(echo "$name" | sed -E 's/QR-Studio-.+-(Windows|Mac)\.zip/\1/')
            tag="v$version"
            notes="notas/$version.md"
            [ -f "$notes" ] || notes=/dev/null
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "QR Studio $version" --notes-file "$notes" --latest
            else
              gh release edit "$tag" --notes-file "$notes"
            fi
            # Nombre estable para el enlace «última versión» (QR-Studio-Windows.zip / QR-Studio-Mac.zip).
            cp "$zip" "staging/QR-Studio-$platform.zip"
            gh release upload "$tag" "staging/QR-Studio-$platform.zip" "$zip" "$zip.sha256" --clobber
          done
