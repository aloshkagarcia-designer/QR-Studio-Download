# Crea o completa la publicación (Release) de cada versión a partir de los ZIP de descargas/.
# Los ZIP se construyen, prueban y auditan (Windows y Mac) en el repositorio privado de QR Studio,
# igual que las apps del teléfono (Android .apk e iPhone .ipa).
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ["descargas/*.zip", "descargas/*.apk", "descargas/*.ipa", "notas/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar cada ZIP con su suma SHA-256
        run: cd descargas && sha256sum -c *.sha256

      - name: Crear o completar la publicación de cada versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staging
          for zip in descargas/QR-Studio-*-*.zip; do
            name=$(basename "$zip")
            version=$(echo "$name" | sed -E 's/QR-Studio-(.+)-(Windows|Mac)\.zip/\1/')
            platform=$(echo "$name" | sed -E 's/QR-Studio-.+-(Windows|Mac)\.zip/\1/')
            tag="v$version"
            notes="notas/$version.md"
            [ -f "$notes" ] || notes=/dev/null
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "QR Studio $version" --notes-file "$notes" --latest
            else
              gh release edit "$tag" --notes-file "$notes"
            fi
            # Nombre estable para el enlace «última versión» (QR-Studio-Windows.zip / QR-Studio-Mac.zip).
            cp "$zip" "staging/QR-Studio-$platform.zip"
            gh release upload "$tag" "staging/QR-Studio-$platform.zip" "$zip" "$zip.sha256" --clobber
          done

      - name: Añadir las apps del teléfono a la última versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(descargas/QR-Studio-Movil-*-Android.apk descargas/QR-Studio-Movil-*-iPhone.ipa)
          [ ${#files[@]} -gt 0 ] || exit 0
          tag=$(gh release view --json tagName -q .tagName)
          mkdir -p staging
          for f in "${files[@]}"; do
            # Nombre estable para el enlace «última versión» (QR-Studio-Android.apk / QR-Studio-iPhone.ipa).
            case "$f" in
              *-Android.apk) stable=QR-Studio-Android.apk ;;
              *-iPhone.ipa) stable=QR-Studio-iPhone.ipa ;;
            esac
            cp "$f" "staging/$stable"
            gh release upload "$tag" "staging/$stable" "$f" "$f.sha256" --clobber
          done
